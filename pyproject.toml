[project]
name = "vinf"
version = "0.1.0"
description = "VINF semester project — custom search engine over animal records"
readme = "README.md"
authors = [
    { name = "JozefZiduliak", email = "Jozefjojo897@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pydantic",
]


[project.scripts]
dev = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/cli.py", "src/crawler.py", "src/parser.py", "src/index"]
