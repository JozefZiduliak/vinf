[project]
name = "vinf"
version = "0.4.1"
description = "VINF semester project — custom search engine over animal records"
readme = "README.md"
authors = [
    { name = "JozefZiduliak", email = "Jozefjojo897@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pydantic",
    "tiktoken>=0.14.0",
]


[project.scripts]
dev = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/cli.py", "src/crawler.py", "src/parser.py", "src/stats.py", "src/index"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
